}

</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            Website<span>Hub</span>
        </div>

        <a
            href="{{ url_for('dashboard') }}"
            class="back-btn"
        >
            ← Dashboard
        </a>

    </nav>


    <!-- EDIT FORM -->

    <div class="container">

        <h1>
            ✏️ Edit Customer
        </h1>

        <p class="subtitle">
            Update the customer's website request details.
        </p>


        <form
            method="POST"
            action="{{ url_for('edit_customer', customer_id=customer[0]) }}"
        >

            <!-- NAME -->

            <div class="form-group">

                <label>
                    Customer Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ customer[1] }}"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ customer[2] }}"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label>
                    Phone
                </label>

                <input
                    type="text"
                    name="phone"
                    value="{{ customer[3] }}"
                >

            </div>


            <!-- WEBSITE TYPE -->

            <div class="form-group">

                <label>
                    Website Type
                </label>

                <select
                    name="website_type"
                    required
                >

                    <option value="">
                        Select Website Type
                    </option>

                    <option
                        value="Restaurant"
                        {% if customer[4] == "Restaurant" %}
                        selected
                        {% endif %}
                    >
                        Restaurant
                    </option>

                    <option
                        value="Business"
                        {% if customer[4] == "Business" %}
                        selected
                        {% endif %}
                    >
                        Business
                    </option>

                    <option
                        value="Portfolio"
                        {% if customer[4] == "Portfolio" %}
                        selected
                        {% endif %}
                    >
                        Portfolio
                    </option>

                    <option
                        value="E-commerce"
                        {% if customer[4] == "E-commerce" %}
                        selected
                        {% endif %}
                    >
                        E-commerce
                    </option>

                    <option
                        value="Other"
                        {% if customer[4] == "Other" %}
                        selected
                        {% endif %}
                    >
                        Other
                    </option>

                </select>

            </div>


            <!-- REQUIREMENTS -->

            <div class="form-group">

                <label>
                    Requirements
                </label>

                <textarea
                    name="message"
                    required
                >{{ customer[5] }}</textarea>

            </div>


            <!-- CRM NOTES -->

            <div class="form-group notes-box">

                <label class="notes-label">
                    📝 CRM Notes
                </label>

                <p class="notes-hint">
                    Add internal notes about this customer or follow-up.
                </p>

                <textarea
                    name="notes"
                    class="notes-textarea"
                    placeholder="Example: Customer interested in an e-commerce website. Follow up next week."
                >{{ customer[8] or '' }}</textarea>

            </div>
<!-- FOLLOW-UP DATE -->

<div class="form-group followup-box">

    <label class="followup-label">
        📅 Follow-up Date
    </label>

    <p class="followup-hint">
        Set the date when you want to follow up with this customer.
    </p>

    <input
        type="date"
        name="follow_up_date"
        value="{{ customer[9] or '' }}"
    >

</div>

            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    type="submit"
                    class="save-btn"
                >
                    💾 Save Changes
                </button>

                <a
                    href="{{ url_for('dashboard') }}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</body>

</html>

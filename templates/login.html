<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebsiteHub | Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef2ff, #fdf4ff);
        }

        .login-card {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 10px;
        }

        .logo span {
            color: #ec4899;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .login-title {
            text-align: center;
            font-size: 25px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .login-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #4338ca;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 18px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #4f46e5;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">
            Website<span>Hub</span>
        </div>

        <p class="subtitle">
            CRM Management System
        </p>

        <h2 class="login-title">
            🔐 Admin Login
        </h2>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">

            <div class="form-group">
                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login to Dashboard
            </button>

        </form>

        <a href="{{ url_for('home') }}" class="back">
            ← Back to Website
        </a>

    </div>

</body>
</html>
